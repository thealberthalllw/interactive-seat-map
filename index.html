<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Albert Hall - View From Your Seat</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>The Albert Hall, Llandrindod Wells</h1>
    <h2>Interactive Seating Map</h2>
    <br/>
    <p>Click any seat to view the view from that seat.</p>
</header>

<div id="mapContainer">
    Loading seating plan...
</div>

<div id="lightbox" class="lightbox">

    <div class="lightbox-content">

        <button id="closeLightbox">&times;</button>

        <h2 id="seatTitle"></h2>

        <img id="seatPhoto"
             src="https://placehold.co/1000x700?text=Photo+Coming+Soon">

        <p id="seatInfo"></p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
